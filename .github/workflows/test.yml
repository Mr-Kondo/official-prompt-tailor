name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-doc-commands:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Run commands extracted from README and docs
        run: python .github/scripts/check_windows_install_docs.py --shell ${{ matrix.shell }}
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, and actions/python-versions has no Python 3.9
        # build for Ubuntu 26.04. Unpin when it has one, or when 3.9 is dropped.
        os: [ubuntu-24.04]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - {os: macos-latest, python: "3.9"}
          - {os: macos-latest, python: "3.14"}
          - {os: windows-latest, python: "3.9"}
          - {os: windows-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
      - name: ZIP sha256 (one commit gives one digest on every runner; docs/maintenance.md)
        shell: bash
        run: mkdir zip-out && python install.py --zip zip-out | grep '^sha256'
