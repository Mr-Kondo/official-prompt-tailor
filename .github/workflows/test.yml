name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, and actions/python-versions has no Python 3.9
        # build for Ubuntu 26.04. Unpin when it has one, or when 3.9 is dropped.
        os: [ubuntu-24.04]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: macos-latest, python: "3.9"}
          - {os: macos-latest, python: "3.14"}
          - {os: windows-latest, python: "3.9"}
          - {os: windows-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
