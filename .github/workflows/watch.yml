name: watch

# Weekly: have the registered official pages changed since their rules were reviewed (drift), and are there
# pages worth a look that are not registered yet (discover)? Each result goes to one issue, labelled
# "drift" / "discover", only when a person has to act. docs/maintenance.md explains the follow-up.
on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      report_only:
        description: "Print the reports only; do not open or edit issues"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  # Pinned like test.yml: ubuntu-latest starts moving to Ubuntu 26 on 2026-10-19, the day of a scheduled run.
  # Unpin both jobs (and release.yml) once a manual run on ubuntu-latest has passed.
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The body each rule was reviewed against, so that `maintain.py rereview` has an old body the day a page changes. A cache, not an
      # artifact and not a commit: a page's full text is not published. Every run saves a new entry; the newest one is restored.
      - uses: actions/cache@v6
        with:
          path: outputs/reviewed-bodies
          key: reviewed-bodies-${{ github.run_id }}
          restore-keys: reviewed-bodies-
      # Exit 2 is DRIFT or INCOMPLETE (the report says which). Any other failure is a broken setup and fails the job.
      - shell: bash
        run: python3 -I .claude/skills/official-prompt-tailor/scripts/evidence.py drift > result.json || [ "$?" -eq 2 ]
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.report_only && ' ' || '--issue' }}
        run: python3 -I .github/scripts/ci_report.py drift result.json $ISSUE | tee -a "$GITHUB_STEP_SUMMARY"
      # When a page changed: how each drifted rule stands against the old body kept in the cache. Read only (no --write); the answer is quoted
      # in this run's Summary and not in the issue. Exit 2 is anything but CURRENT.
      - shell: bash
        run: |
          if [ "$(python3 -I -c 'import json; print(json.load(open("result.json"))["verdict"])')" = DRIFT ]; then
            python3 -I tools/maintain.py rereview > rereview.json || [ "$?" -eq 2 ]
            python3 -I .github/scripts/ci_report.py rereview rereview.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # Exit 2 is PARTIAL: some rule has no old body yet (the page changed before it was kept, or could not be fetched this time).
      - shell: bash
        run: python3 -I tools/maintain.py keep > kept.json || [ "$?" -eq 2 ]
      - shell: bash
        run: python3 -I .github/scripts/ci_report.py kept kept.json | tee -a "$GITHUB_STEP_SUMMARY"

  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - shell: bash
        run: python3 -I tools/maintain.py discover > result.json || [ "$?" -eq 2 ]
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.report_only && ' ' || '--issue' }}
        run: python3 -I .github/scripts/ci_report.py discover result.json $ISSUE | tee -a "$GITHUB_STEP_SUMMARY"
