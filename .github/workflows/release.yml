name: release

# Pushing a tag vX.Y.Z publishes a GitHub Release (notes only; the skill is installed with the Skills CLI from main).
# The notes are release-notes/vX.Y.Z.md when the tag has that file (commit it before tagging), else generated.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Pinned like test.yml and watch.yml: ubuntu-latest starts moving to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag must match the skill VERSION
        run: test "$(cat .claude/skills/official-prompt-tailor/VERSION)" = "${GITHUB_REF_NAME#v}"
      - run: python3 -m unittest discover -s tests
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "release-notes/$GITHUB_REF_NAME.md" ]; then notes=(--notes-file "release-notes/$GITHUB_REF_NAME.md"); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag "${notes[@]}"
